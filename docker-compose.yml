services:
  postgres-db:
    image: postgres:15
    container_name: postgres_music
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: musicuser
      POSTGRES_PASSWORD: musicpassword
      POSTGRES_DB: musicdb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U musicuser -d musicdb"]
      interval: 5s
      retries: 5

  minio:
    image: minio/minio
    container_name: minio_music
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      retries: 5

  api-music:
    build: .
    container_name: spring_api_music
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/musicdb
      MINIO_URL: http://minio:9000
    depends_on:
      postgres-db:
        condition: service_healthy
      minio:
        condition: service_healthy